<html lang="ar" dir="rtl">

        .card { background: white; padding: 30px; border-radius: 16px; max-width: 550px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }

        hr { border: none; border-top: 1px solid #eee; margin: 20px 0; }
        .btn { display: block; width: 100%; box-sizing: border-box; margin: 12px 0; padding: 14px 20px; background-color: #0066cc; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; transition: background-color 0.2s; }
        .btn:hover { background-color: #004999; }
        .btn-secondary { background-color: #2b6cb0; }
        .btn-secondary:hover { background-color: #1c4ed8; }
